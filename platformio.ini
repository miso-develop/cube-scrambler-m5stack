[platformio]
default_envs = m5stack-nanoc6
data_dir = .pio/web-ui

[env:m5stack-nanoc6]
; M5Stack's NanoC6 documentation recommends pioarduino for PlatformIO + Arduino.
; Pin the platform release so local builds and GitHub Actions use the same toolchain.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip

; Use the repository-local NanoC6 board definition. The generic ESP32-C6 DevKitC
; definition assumes 8 MB Flash, while NanoC6 has 4 MB.
board = m5stack-nanoc6

; Final 4 MB layout: dual OTA app slots + dedicated solver table + Web UI.
board_build.partitions = partitions/cube_scrambler_4mb.csv
board_build.filesystem = spiffs
framework = arduino

; 1.5 Mbps worked for short firmware uploads but the larger SPIFFS transfer lost
; the ESP32-C6 connection on real NanoC6 hardware. 460800 is deliberately used
; for both firmware and filesystem reliability.
upload_speed = 460800
monitor_speed = 115200
; Buffer keyboard input locally and send the complete command when Enter is
; pressed. Local echo makes the typed command visible in the terminal.
monitor_filters = send_on_enter
monitor_echo = yes
monitor_eol = CRLF

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Distribution builds must never pick up a developer's ignored
; include/wifi_credentials.h. With blank NVS they boot in AP mode and are then
; configured by the user.
[env:m5stack-nanoc6-release]
extends = env:m5stack-nanoc6
build_flags =
    ${env:m5stack-nanoc6.build_flags}
    -DCUBE_DISTRIBUTION_BUILD=1
