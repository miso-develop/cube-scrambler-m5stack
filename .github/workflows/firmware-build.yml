name: Firmware Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/firmware-build.yml'
      - '.node-version'
      - 'boards/**'
      - 'config/devices/**'
      - 'include/**'
      - 'partitions/**'
      - 'platformio.ini'
      - 'scripts/**'
      - 'src/**'
      - 'tools/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/firmware-build.yml'
      - '.node-version'
      - 'boards/**'
      - 'config/devices/**'
      - 'include/**'
      - 'partitions/**'
      - 'platformio.ini'
      - 'scripts/**'
      - 'src/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and validate NanoC6 distribution
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CUBE_DEVICE: m5stack-nanoc6

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio/.cache
          key: ${{ runner.os }}-platformio-${{ hashFiles('platformio.ini', 'boards/**', 'config/devices/**') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install tooling
        run: python -m pip install --disable-pip-version-check platformio==6.1.19 "cryptography>=45,<47"

      - name: Validate host-side sources
        run: |
          node --check tools/web_installer/installer.js
          node --check tools/generate_min2phase_tables.js
          node --check tools/generate_web_ui.js
          node --check tools/finalize_web_bootstrap.js
          python -m py_compile tools/device_profiles.py tools/build_release_bundle.py tools/check_flash_layout.py tools/generate_https_cert.py tools/test_device_profiles.py tools/test_profile_driven_release.py
          python tools/test_device_profiles.py
          python tools/test_profile_driven_release.py

      - name: Generate Min2Phase table image
        run: node tools/generate_min2phase_tables.js --output .pio/min2phase-tables.bin

      - name: Generate pinned Web UI assets
        run: |
          node tools/generate_web_ui.js --output .pio/web-ui
          node tools/finalize_web_bootstrap.js --web-dir .pio/web-ui

      - name: Generate distribution HTTPS certificate
        run: python tools/generate_https_cert.py --output-dir local/https --web-dir .pio/web-ui --hostname cube-scrambler.local

      - name: Build credential-free release firmware
        run: pio run -e m5stack-nanoc6-release

      - name: Build release Web SPIFFS
        run: pio run -e m5stack-nanoc6-release -t buildfs

      - name: Validate final flash layout
        run: python tools/check_flash_layout.py --device "$CUBE_DEVICE"

      - name: Build full-flash release bundle
        run: python tools/build_release_bundle.py --device "$CUBE_DEVICE" --version ci

      - name: Validate NanoC6 release contract
        run: |
          test -f .pio/release/web-installer/index.html
          test -f .pio/release/web-installer/installer.js
          test -f .pio/release/web-installer/manifest.json
          test -f .pio/release/web-installer/cube-scrambler-nanoc6-full.bin
          test -f .pio/release/web-installer/ca.crt
          node --check .pio/release/web-installer/installer.js
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.pio/release')
          manifest = json.loads((root / 'web-installer' / 'manifest.json').read_text(encoding='utf-8'))
          release = json.loads((root / 'release.json').read_text(encoding='utf-8'))
          parts = {part['name']: part for part in release['parts']}

          # These are independent NanoC6 baseline guards. They intentionally do
          # not derive expected values from the profile under test.
          assert manifest['name'] == 'Cube Scrambler NanoC6'
          assert manifest['builds'][0]['chipFamily'] == 'ESP32-C6'
          assert manifest['builds'][0]['parts'] == [{'path': 'cube-scrambler-nanoc6-full.bin', 'offset': 0}]
          assert manifest['new_install_improv_wait_time'] == 0
          assert (root / 'web-installer' / 'cube-scrambler-nanoc6-full.bin').stat().st_size == 0x400000
          assert release['name'] == 'Cube Scrambler NanoC6'
          assert release['deviceId'] == 'm5stack-nanoc6'
          assert release['flashSize'] == 0x400000
          assert release['platformioReleaseEnv'] == 'm5stack-nanoc6-release'
          assert release['partitionFile'] == 'partitions/cube_scrambler_4mb.csv'
          assert release['mergedImage']['path'] == 'cube-scrambler-nanoc6-full.bin'
          assert release['mergedImage']['size'] == 0x400000
          assert release['repository'] == 'https://github.com/miso-develop/cube-scrambler-m5stack'
          assert parts['solver']['offset'] == 0x2B0000
          assert parts['web']['offset'] == 0x3C0000
          assert parts['web']['limit'] == 0x400000
          PY
