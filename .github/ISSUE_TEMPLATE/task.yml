name: Loop Task
description: Create one vertical production implementation ticket under a settled Spec.
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form only for one implementation slice under an existing `[Spec]`. A Task should fit one implementation iteration and one coherent PR.
  - type: input
    id: parent-spec
    attributes:
      label: Parent spec
      description: Reference the parent `[Spec]` Issue.
      placeholder: "#123"
    validations:
      required: true
  - type: textarea
    id: what-to-build
    attributes:
      label: What to build
      description: Describe the narrow end-to-end behavior delivered by this Task.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: List externally observable completion criteria using checkboxes.
      placeholder: "- [ ] Observable criterion"
    validations:
      required: true
  - type: textarea
    id: blocked-by
    attributes:
      label: Blocked by
      description: "List one prerequisite `[Task]` Issue per line using `- #123`, or keep `- None` when unblocked."
      value: "- None"
    validations:
      required: true
