name: Loop Spec
description: Capture a settled feature specification before implementation tickets are created.
title: "[Spec] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form after the important decisions are settled. Project-wide constraints belong in `PROJECT.md`; reference them instead of duplicating them.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem from the user or operator perspective.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the result that must be true when this Spec is complete.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: List observable requirements, one per bullet where practical.
      placeholder: "- Requirement"
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions
      description: Record only settled behavior or implementation decisions that materially constrain implementation.
      placeholder: "- None beyond PROJECT.md"
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: State the important observable checks or test seams for the completed feature.
      placeholder: "- Verification condition"
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: List behavior explicitly excluded from this Spec.
      placeholder: "- None"
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link relevant Map, Decision, architecture, or external references. Keep `PROJECT.md` as the project-wide charter.
      value: "- `PROJECT.md`"
    validations:
      required: true
  - type: textarea
    id: implementation-tasks
    attributes:
      label: Implementation tasks
      description: `to-tickets` replaces this placeholder with the canonical Task index after decomposition.
      value: "- Pending `to-tickets` decomposition."
    validations:
      required: true
