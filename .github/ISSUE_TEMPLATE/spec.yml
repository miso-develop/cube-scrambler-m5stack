name: Loop Spec
description: Capture a settled feature contract before implementation tickets are created.
title: "[Spec] "
body:
  - type: markdown
    attributes:
      value: |
        Use this form after the important decisions are settled. Project-wide constraints belong in `PROJECT.md`; reference them instead of duplicating them. A Spec defines the contract; tests/checks/review are verification evidence for that contract.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the problem from the user or operator perspective.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: Describe the result that must be true when this Spec is complete.
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
      description: List observable requirements, one per bullet where practical.
      placeholder: "- Requirement"
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions
      description: Record only settled behavior or implementation decisions that materially constrain implementation.
      placeholder: "- None beyond PROJECT.md"
    validations:
      required: false
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: State the important observable checks, build/runtime checks, hardware evidence, or review seams for the completed feature.
      placeholder: "- Verification condition"
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: List behavior explicitly excluded from this Spec.
      placeholder: "- None"
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: References
      description: Link relevant Map, Decision, current repository documentation, architecture, or external references. Keep `PROJECT.md` as the project-wide charter.
      value: "- `PROJECT.md`"
    validations:
      required: true
  - type: textarea
    id: repository-knowledge
    attributes:
      label: Repository knowledge
      description: Initial assessment of durable knowledge that may need to become repository current truth through code, configuration, documentation, or executable verification. Re-evaluate this at Spec closeout.
      placeholder: "- None identified yet, or describe candidate durable knowledge"
    validations:
      required: false
  - type: textarea
    id: implementation-tasks
    attributes:
      label: Implementation tasks
      description: `to-tickets` replaces this placeholder with the canonical Task index after decomposition. Spec closeout also requires Requirements, verification, repository-knowledge promotion, and repository consistency to be complete.
      value: "- Pending `to-tickets` decomposition."
    validations:
      required: true
